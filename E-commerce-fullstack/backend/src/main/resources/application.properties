spring.application.name=ecommerce-backend
server.port=${SERVER_PORT:8080}

# Load backend/.env (KEY=value lines). Tried from the current working dir first,
# then from the directory this jar lives in, so the app starts regardless of CWD.
spring.config.import=optional:file:./E-commerce-fullstack/backend/.env[.properties],optional:file:./.env[.properties]

# ---- MySQL --------------------------------------------------------------
# DB_PASSWORD has NO default on purpose: the app refuses to start without it.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}

# ---- JPA / Hibernate ----------------------------------------------------
# "update" is convenient for development only. For production use "validate" (or "none")
# plus versioned migrations (Flyway/Liquibase) - see README.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# ---- Uploads ------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Application settings ----------------------------------------------
# JWT_SECRET: Use at least 32 characters. Falls back to a dev-only value if not set in .env.
app.jwt.secret=${JWT_SECRET:velure_dev_secret_key_replace_in_production_32ch}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.upload.dir=${UPLOAD_DIR:uploads}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# First admin account, created at startup only if no ADMIN exists and ADMIN_PASSWORD is set.
app.admin.email=${ADMIN_EMAIL:admin@velure.local}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_NAME:Administrator}
